name = "omkarsir-pdf-delivery"
main = "worker.js"
compatibility_date = "2026-10-12"
workers_dev = true

# Private PDF storage — configure ONE (worker.js picks R2 > KV > GitHub, or set STORAGE_BACKEND):
# A) Workers KV (no payment method needed; 25 MiB per PDF max):
[[kv_namespaces]]
binding = "PDF_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
# B) R2 (Cloudflare requires a payment method on the account to enable R2):
# [[r2_buckets]]
# binding = "PDF_BUCKET"
# bucket_name = "REPLACE_WITH_PRIVATE_R2_BUCKET_NAME"
# C) Private GitHub repo: set GITHUB_PDF_REPO (+ GITHUB_PDF_REF, GITHUB_PDF_PATH_PREFIX) below
#    and `wrangler secret put GITHUB_PDF_TOKEN` (fine-grained, Contents: read-only, that repo only).

[vars]
# R2 object key of each PDF (upload with exactly these names, bucket stays private).
PDF_OBJECT_KEY = "adhunik-bharat-itihas.pdf"
RAJASTHAN_HISTORY_PDF_OBJECT_KEY = "rajasthan-history.pdf"
RAS_MAINS_P2_PDF_OBJECT_KEY = "ras-mains-paper-2.pdf"
ECONOMIC_SURVEY_PDF_OBJECT_KEY = "rajasthan-arthvyavastha-2025-26.pdf"

# Products are identified by Razorpay Payment Button ID (+ amount). Defaults are in
# worker.js; override here (comma-separated) if a button is replaced.
ADHUNIK_BUTTON_IDS = "pl_Tmzqpr6RIRGU0K"
RAJASTHAN_HISTORY_BUTTON_IDS = "pl_TpCUODSwC6kIR9"
RAS_MAINS_P2_BUTTON_IDS = "pl_TmyJkDLHXDE2N3"
ECONOMIC_SURVEY_BUTTON_IDS = ""

# FALLBACK ONLY: pipe-separated substrings of payment.description. Payment Button
# payments normally carry "#<button id>" here, not the title, so leave these empty
# unless a test payment shows otherwise. Ambiguous matches fail closed.
ALLOWED_PAYMENT_DESCRIPTIONS = ""
RAJASTHAN_HISTORY_PAYMENT_DESCRIPTIONS = ""
RAS_MAINS_P2_PAYMENT_DESCRIPTIONS = ""
ECONOMIC_SURVEY_PAYMENT_DESCRIPTIONS = ""

# Optional: accepted amounts in paise per product (defaults in worker.js:
# Modern History 900,4900,9900 · all others 4900).
# ADHUNIK_AMOUNTS_PAISE = "4900"

DOWNLOAD_TTL_SECONDS = "604800"
# Website /verify: payments older than this many minutes must also give the checkout email.
VERIFY_FRESH_MINUTES = "30"
ALLOWED_ORIGINS = "https://omkarsir.com,https://www.omkarsir.com"
# Must exactly match the deployed Worker URL through the trailing equals sign.
PUBLIC_DOWNLOAD_BASE = "https://REPLACE-WORKER-DOMAIN/download?token="
