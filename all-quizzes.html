<head>

<meta name="description" content="Omkar Sir के सभी Quiz और Test Series अब Subject और Topic के अनुसार व्यवस्थित। RAS, Rajasthan GK, Economy, Polity, Current Affairs और अन्य Quiz एक ही जगह।">
<meta name="robots" content="index, follow">

<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Hind,sans-serif;background:#f8f9fa;color:#1a1a2e}.tri{height:4px;background:linear-gradient(90deg,#ff6b00 33%,#fff 33% 66%,#00a651 66%)}
.hero{background:linear-gradient(135deg,#fff8f2,#fffdf0);text-align:center;padding:42px 6% 28px;border-bottom:1px solid #ffe0c0}.hero h1{font:800 clamp(25px,4vw,38px) Poppins,sans-serif}.hero h1 span{color:#ff6b00}.hero p{margin-top:8px;color:#666;font-size:14px}.stats{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:18px}.stat{background:#fff;border:2px solid #e8eaf0;border-radius:12px;padding:9px 17px;min-width:105px}.stat b{display:block;color:#ff6b00;font:800 20px Poppins,sans-serif}.stat small{color:#888;font-size:11px}
.nav{max-width:1150px;margin:18px auto 0;padding:0 6%;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.nav a{background:#fff;border:2px solid #e8eaf0;color:#1b2a6b;text-decoration:none;padding:7px 13px;border-radius:22px;font-size:12px;font-weight:700}.nav a:hover{border-color:#ff6b00;color:#ff6b00}
.wrap{max-width:1150px;margin:auto;padding:24px 6% 55px}.subject{margin:0 0 38px;scroll-margin-top:15px}.subject-head{display:flex;align-items:center;gap:9px;border-bottom:3px solid #ff6b00;padding-bottom:8px}.subject-head h2{font:800 19px Poppins,sans-serif}.count{margin-left:auto;background:#f0f1f5;border-radius:12px;padding:3px 10px;color:#777;font-size:11px;font-weight:700}.desc{color:#888;font-size:12.5px;margin:7px 0 15px}.topic{margin:18px 0}.topic h3{font-size:15px;color:#1b2a6b;margin-bottom:9px;padding-left:10px;border-left:4px solid #ff6b00}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(275px,1fr));gap:12px}.card{display:flex;align-items:center;gap:12px;background:#fff;border:2px solid #e8eaf0;border-radius:13px;padding:14px 15px;text-decoration:none;color:inherit;transition:.18s}.card:hover{border-color:#ff6b00;transform:translateY(-2px);box-shadow:0 7px 18px rgba(255,107,0,.1)}.icon{width:44px;height:44px;border-radius:11px;background:#fff3e8;display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}.info{min-width:0;flex:1}.title{font-weight:700;font-size:13.5px;line-height:1.35}.meta{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}.meta span{background:#f5f6fa;color:#888;border-radius:7px;padding:2px 7px;font-size:10.5px}.arrow{color:#ff6b00;font-size:18px}.archive{background:linear-gradient(135deg,#1b2a6b,#0d1840);color:#fff;border-radius:15px;padding:20px}.archive p{color:#cbd1e8;font-size:12px;margin:3px 0 12px}.dates{display:flex;gap:6px;flex-wrap:wrap}.dates a{color:#fff;text-decoration:none;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);padding:5px 9px;border-radius:8px;font-size:11px}.dates a:hover{background:#ff6b00}.subject-pages{display:flex;gap:9px;flex-wrap:wrap}.subject-pages a{background:#fff;border:2px solid #e8eaf0;border-radius:11px;padding:9px 13px;color:#1a1a2e;text-decoration:none;font-size:12.5px;font-weight:700}.subject-pages a:hover{border-color:#ff6b00;color:#ff6b00}.load{text-align:center;color:#999;padding:45px}footer{background:#1a1a2e;color:#aaa;text-align:center;padding:30px 6%;font-size:12px}footer b{font:800 20px Poppins;color:#fff}footer b span{color:#ff6b00}
@media(max-width:600px){.grid{grid-template-columns:1fr}.hero{padding-top:32px}.subject-head h2{font-size:16px}.wrap{padding-left:4%;padding-right:4%}}
</style>
</head>
<body>
<div id="nied-navbar"></div><div class="tri"></div>
<section class="hero"><h1>🧠 सभी <span>Quiz</span> & Test Series</h1><p>अब सभी Quiz को Subject → Topic → Test के क्रम में व्यवस्थित किया गया है।</p><div class="stats" id="stats"></div></section>
<nav class="nav" id="nav"></nav>
<main class="wrap" id="content"><div class="load">Quiz list लोड हो रही है...</div></main>
<footer><b>Omkar Sir<span>.</span></b><div>New India Education, Jaipur, Rajasthan</div><div style="margin-top:7px"><a href="/" style="color:#ff6b00">Home</a> · <a href="/privacy.html" style="color:#ff6b00">Privacy Policy</a></div></footer>
<script src="/nied-menu.js" defer></script>
<script>
const MONTHS=['जनवरी','फ़रवरी','मार्च','अप्रैल','मई','जून','जुलाई','अगस्त','सितंबर','अक्टूबर','नवंबर','दिसंबर'];
const ORDER=['daily-ca','ras-prelims-mock','rajasthan-bhugol','arthavyavastha','rajniti-vigyan','mixed-gk'];
const TOPIC_RULES={
'rajasthan-bhugol':[
['भौतिक भूगोल / स्थिति व विभाजन',['स्थिति','विभाजन','पर्वत','पठार','दर्रा','भौगोलिक']],
['जलवायु, अपवाह व जल संसाधन',['जलवायु','अपवाह','झील','बांध','सिचाई','सिंचाई']],
['मृदा, कृषि व पशु संपदा',['मृदा','कृषि','फसल','पशु संपदा']],
['वन, वनस्पति व वन्यजीव',['वनस्पति','वन्यजीव','प्राकृतिक वन','वन ']],
['खनिज व ऊर्जा संसाधन',['खनिज','खान','ऊर्जा','संसाधन']],
['जनसंख्या, नगरीकरण व साक्षरता',['जनसंख्या','शहरीकरण','नगरीय','साक्षरता']],
['परिवहन व पर्यटन',['परिवहन','पर्यटन']],
['आर्थिक विकास व गरीबी',['आर्थिक विकास','आर्थिक समीक्षा','निर्धनता','बेरोजगारी','सूखा','अकाल','बंजर']],
['राजस्थान PYQs',['PYQ','PYQs']],
['राजस्थान विधानसभा',['विधानसभा']]
],
'arthavyavastha':[
['Rajasthan Economic Survey',['ES ','Economic Survey','स्वास्थ्य','शिक्षा','सामाजिक सशक्तिकरण','पर्यटन एवं संस्कृति','कृषि-खाद्य']],
['उद्योग, खनन व आर्थिक वृद्धि',['उद्योग','industry','औद्योगिक','खनन','आर्थिक वृद्धि']],
['Economy PYQs',['PYQ','PYQs','SI ECONOMY']]
],
'rajniti-vigyan':[
['मुख्यमंत्री व मंत्रिपरिषद',['CM and ministers']],
['राजस्थान Polity — SI PYQs',['SUB INSPECTOR','PYQ']]
]
};
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function dateHi(v){if(!v)return '';let [y,m,d]=v.split('-').map(Number);return `${d} ${MONTHS[m-1]} ${y}`;}
function topicFor(subject,q){let rules=TOPIC_RULES[subject.id]||[];let t=(q.title||'').toLowerCase();for(const [name,keys] of rules){if(keys.some(k=>t.includes(k.toLowerCase())))return name;}return 'अन्य / Practice Tests';}
function sorted(a){return [...a].sort((x,y)=>(y.date||'').localeCompare(x.date||''));}
function card(q){return `<a class="card" href="${esc(q.url)}"><span class="icon">${esc(q.icon||'📝')}</span><span class="info"><span class="title">${esc(q.title)}</span><span class="meta"><span>${esc(q.questions)} प्रश्न</span><span>${esc(q.duration)}</span><span>${esc(dateHi(q.date))}</span></span></span><span class="arrow">→</span></a>`;}
function renderGrid(s){let groups={};sorted(s.quizzes||[]).forEach(q=>{let k=topicFor(s,q);(groups[k]??=[]).push(q);});let html=Object.entries(groups).map(([topic,qs])=>`<section class="topic"><h3>${esc(topic)} <small style="color:#999;font-weight:600;font-size:11px">(${qs.length})</small></h3><div class="grid">${qs.map(card).join('')}</div></section>`).join('');let link=s.subjectPageUrl?` <a href="${esc(s.subjectPageUrl)}" style="color:#1b2a6b;font-weight:700;text-decoration:none">पूरा Subject Page →</a>`:'';return `<section class="subject" id="${esc(s.id)}"><div class="subject-head"><h2>${esc(s.icon||'📚')} ${esc(s.name)}</h2><span class="count">${(s.quizzes||[]).length} Quiz</span></div><p class="desc">${esc(s.description||'')} ${link}</p>${html}</section>`;}
function renderArchive(s){let dates=[...(s.dates||[])].sort((a,b)=>(b.date||'').localeCompare(a.date||''));return `<section class="subject" id="${esc(s.id)}"><div class="subject-head"><h2>${esc(s.icon||'📅')} ${esc(s.name)}</h2><span class="count">${dates.length} Quiz</span></div><p class="desc">${esc(s.description||'')}</p><div class="archive"><strong>📰 Daily Current Affairs — पूरा Archive</strong><p>सभी उपलब्ध Daily Quiz तारीख के अनुसार नवीनतम से पुराने क्रम में।</p><div class="dates">${dates.map(d=>`<a href="${esc(d.url)}">${esc(dateHi(d.date))}</a>`).join('')}</div></div></section>`;}
function renderSubjectPages(pages){if(!pages?.length)return '';return `<section class="subject"><div class="subject-head"><h2>📚 अन्य Subject-wise Quiz Pages</h2><span class="count">${pages.length} Subjects</span></div><p class="desc">इन Subjects के अलग Quiz Pages भी उपलब्ध हैं; नए quizzes जुड़ते ही उन्हें संबंधित Subject में रखा जा सकता है।</p><div class="subject-pages">${pages.map(p=>`<a href="${esc(p.url)}">${esc(p.icon||'📚')} ${esc(p.title)}</a>`).join('')}</div></section>`;}
fetch('/quizzes-data.json').then(r=>{if(!r.ok)throw Error('डेटा नहीं मिला');return r.json();}).then(data=>{let subjects=[...(data.subjects||[])].sort((a,b)=>{let ai=ORDER.indexOf(a.id),bi=ORDER.indexOf(b.id);return (ai<0?99:ai)-(bi<0?99:bi);});let total=0;subjects.forEach(s=>total+=s.type==='archive'?(s.dates?.length||0):(s.quizzes?.length||0));let gridCount=subjects.filter(s=>s.type==='grid').length;document.getElementById('stats').innerHTML=`<div class="stat"><b>${total}</b><small>कुल Quiz</small></div><div class="stat"><b>${gridCount}</b><small>मुख्य Subjects</small></div><div class="stat"><b>${data.subjectPages?.length||0}</b><small>Subject Pages</small></div>`;document.getElementById('nav').innerHTML=subjects.map(s=>`<a href="#${esc(s.id)}">${esc(s.icon||'📚')} ${esc(s.name.split('(')[0].trim())}</a>`).join('');document.getElementById('content').innerHTML=subjects.map(s=>s.type==='archive'?renderArchive(s):renderGrid(s)).join('')+renderSubjectPages(data.subjectPages);}).catch(e=>{console.error(e);document.getElementById('content').innerHTML='<div class="load">Quiz list लोड नहीं हो सकी। कृपया page reload करें।</div>';});
</script>
</body>
</html>
