ize:11px}.subject-pages{display:flex;gap:9px;flex-wrap:wrap}.subject-pages a{background:#fff;border:2px solid #e8eaf0;border-radius:11px;padding:9px 13px;color:#1a1a2e;text-decoration:none;font-size:12.5px;font-weight:700}.load{text-align:center;color:#999;padding:45px}footer{background:#1a1a2e;color:#aaa;text-align:center;padding:30px 6%;font-size:12px}footer b{font:800 20px Poppins;color:#fff}footer b span{color:#ff6b00}

<body>
<div id="nied-navbar"></div><div class="tri"></div>
<section class="hero"><h1>🧠 सभी <span>Quiz</span> & Test Series</h1><p>Subject → Topic → Quiz | Duplicate entries हटाकर</p><div class="stats" id="stats"></div></section>
<nav class="nav" id="nav"></nav>
<div class="controls"><button type="button" onclick="setAllSubjects(true)">➕ सभी खोलें</button><button type="button" onclick="setAllSubjects(false)">➖ सभी बंद करें</button></div>
<main class="wrap" id="content"><div class="load">Quiz list लोड हो रही है...</div></main>
<footer><b>Omkar Sir<span>.</span></b><div>New India Education, Jaipur, Rajasthan</div></footer>
<script src="/nied-menu.js" defer></script>
<script>
const ORDER=['daily-ca','ras-prelims-mock','rajasthan-bhugol','arthavyavastha','rajniti-vigyan','bharatiya-itihas','vigyan-samsamayiki','mixed-gk'];
const TOPIC_RULES={'rajasthan-bhugol':[['भौतिक भूगोल / स्थिति व विभाजन',['स्थिति','विभाजन','पर्वत','पठार','दर्रा','भौगोलिक']],['जलवायु, अपवाह व जल संसाधन',['जलवायु','अपवाह','झील','बांध','सिचाई','सिंचाई']],['मृदा, कृषि व पशु संपदा',['मृदा','कृषि','फसल','पशु संपदा']],['वन, वनस्पति व वन्यजीव',['वनस्पति','वन्यजीव','प्राकृतिक वन','वन ']],['खनिज व ऊर्जा संसाधन',['खनिज','खान','ऊर्जा','संसाधन']],['जनसंख्या, नगरीकरण व साक्षरता',['जनसंख्या','शहरीकरण','नगरीय','साक्षरता']],['परिवहन व पर्यटन',['परिवहन','पर्यटन']],['आर्थिक विकास व गरीबी',['आर्थिक विकास','आर्थिक समीक्षा','निर्धनता','बेरोजगारी','सूखा','अकाल','बंजर']],['राजस्थान PYQs',['PYQ','PYQs']],['राजस्थान विधानसभा',['विधानसभा']]],'arthavyavastha':[['Rajasthan Economic Survey',['ES ','Economic Survey','स्वास्थ्य','शिक्षा','सामाजिक सशक्तिकरण','पर्यटन एवं संस्कृति','कृषि-खाद्य']],['उद्योग, खनन व आर्थिक वृद्धि',['उद्योग','industry','औद्योगिक','खनन','आर्थिक वृद्धि']],['Economy PYQs',['PYQ','PYQs','SI ECONOMY','TOP 150']]],'rajniti-vigyan':[['मुख्यमंत्री व मंत्रिपरिषद',['CM and ministers']],['राज्यपाल',['राज्यपाल']],['राजस्थान Polity — SI PYQs',['SUB INSPECTOR','PYQ']],['भारतीय संविधान व राजव्यवस्था',['संविधान','राजव्यवस्था','TOP 150']]],'bharatiya-itihas':[['आधुनिक भारत का इतिहास',['आधुनिक','Modern','यूरोपियों']],['इतिहास Mega Quiz / Mock',['150 प्रश्न','TOP 150']],['Quick Check',['Quick Check']]],'vigyan-samsamayiki':[['सामान्य विज्ञान',['विज्ञान','Science']],['मासिक समसामयिकी MCQs',['समसामयिकी','MCQ']]]};
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function topicFor(s,q){let rules=TOPIC_RULES[s.id]||[],t=(q.title||'').toLowerCase();for(const[name,keys]of rules)if(keys.some(k=>t.includes(k.toLowerCase())))return name;return 'अन्य / Practice Tests';}
function dedupeQuizzes(list){const seen=new Set();return [...list].sort((a,b)=>(b.date||'').localeCompare(a.date||'')).filter(q=>{const key=[q.title,q.questions,q.duration,q.date].map(v=>String(v??'').trim().toLowerCase()).join('|');if(seen.has(key))return false;seen.add(key);return true;});}
function card(q){return `<a class="card" href="${esc(q.url)}"><span class="icon">${esc(q.icon||'📝')}</span><span class="info"><span class="title">${esc(q.title)}</span><span class="meta"><span>${esc(q.questions)} प्रश्न</span><span>${esc(q.duration)}</span></span></span><span class="arrow">→</span></a>`;}
function subjectHead(icon,name,count){return `<div class="subject-head" role="button" tabindex="0" aria-expanded="true"><h2>${esc(icon||'📚')} ${esc(name)}</h2><span class="count">${count} Quiz</span><button class="subject-toggle" type="button" aria-label="विषय खोलें या बंद करें">⌄</button></div>`;}
function renderGrid(s){const qs=dedupeQuizzes(s.quizzes||[]),groups={};qs.forEach(q=>{const k=topicFor(s,q);(groups[k]??=[]).push(q);});const html=Object.entries(groups).map(([topic,items])=>`<section class="topic"><h3>${esc(topic)} <small style="color:#999;font-size:11px">(${items.length})</small></h3><div class="grid">${items.map(card).join('')}</div></section>`).join('');const link=s.subjectPageUrl?` <a href="${esc(s.subjectPageUrl)}" style="color:#1b2a6b;font-weight:700;text-decoration:none">पूरा Subject Page →</a>`:'';return `<section class="subject" id="${esc(s.id)}">${subjectHead(s.icon,s.name,qs.length)}<div class="subject-body"><p class="desc">${esc(s.description||'')} ${link}</p>${html}</div></section>`;}
function renderArchive(s){const dates=[...(s.dates||[])].sort((a,b)=>(b.date||'').localeCompare(a.date||''));return `<section class="subject" id="${esc(s.id)}">${subjectHead(s.icon,s.name,dates.length)}<div class="subject-body"><p class="desc">${esc(s.description||'')}</p><div class="archive"><strong>📰 Daily Current Affairs — पूरा Archive</strong><p>सभी उपलब्ध Daily Quiz यहाँ हैं।</p><div class="dates">${dates.map(d=>`<a href="${esc(d.url)}">Quiz</a>`).join('')}</div></div></div></section>`;}
function renderSubjectPages(pages){if(!pages?.length)return '';return `<section class="subject" id="subject-pages">${subjectHead('📚','अन्य Subject-wise Quiz Pages',pages.length)}<div class="subject-body"><p class="desc">अलग-अलग Subject के dedicated Quiz Pages।</p><div class="subject-pages">${pages.map(p=>`<a href="${esc(p.url)}">${esc(p.icon||'📚')} ${esc(p.title)}</a>`).join('')}</div></div></section>`;}
function toggleSubject(head){const subject=head.closest('.subject');const collapsed=subject.classList.toggle('collapsed');head.setAttribute('aria-expanded',String(!collapsed));}
function setAllSubjects(open){document.querySelectorAll('.subject').forEach(s=>s.classList.toggle('collapsed',!open));document.querySelectorAll('.subject-head').forEach(h=>h.setAttribute('aria-expanded',String(open)));}
function bindSubjectToggles(){document.querySelectorAll('.subject-head').forEach(h=>{h.addEventListener('click',e=>{if(e.target.closest('a'))return;toggleSubject(h);});h.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggleSubject(h);}});});}
fetch('/quizzes-data.json').then(r=>{if(!r.ok)throw Error('डेटा नहीं मिला');return r.json();}).then(data=>{const subjects=[...(data.subjects||[])].sort((a,b)=>{let ai=ORDER.indexOf(a.id),bi=ORDER.indexOf(b.id);return(ai<0?99:ai)-(bi<0?99:bi);});let totalBefore=0,totalAfter=0;subjects.forEach(s=>{if(s.type==='archive'){totalBefore+=s.dates?.length||0;totalAfter+=s.dates?.length||0;}else{totalBefore+=s.quizzes?.length||0;totalAfter+=dedupeQuizzes(s.quizzes||[]).length;}});document.getElementById('stats').innerHTML=`<div class="stat"><b>${totalAfter}</b><small>Unique Quiz</small></div><div class="stat"><b>${totalBefore-totalAfter}</b><small>Duplicate हटाए</small></div><div class="stat"><b>${subjects.filter(s=>s.type==='grid').length}</b><small>मुख्य Subjects</small></div>`;document.getElementById('nav').innerHTML=subjects.map(s=>`<a href="#${esc(s.id)}">${esc(s.icon||'📚')} ${esc(s.name.split('(')[0].trim())}</a>`).join('');document.getElementById('content').innerHTML=subjects.map(s=>s.type==='archive'?renderArchive(s):renderGrid(s)).join('')+renderSubjectPages(data.subjectPages);bindSubjectToggles();}).catch(e=>{console.error(e);document.getElementById('content').innerHTML='<div class="load">Quiz list लोड नहीं हो सकी। कृपया page reload करें।</div>';});
</script>
</body>
