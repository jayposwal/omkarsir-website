<script src="/nied-menu.js" defer></script>
<script>
const HINDI_MONTHS = ['जनवरी','फ़रवरी','मार्च','अप्रैल','मई','जून','जुलाई','अगस्त','सितंबर','अक्टूबर','नवंबर','दिसंबर'];

function hindiDate(iso){
  if(!iso) return '';
  const [y,m,d] = iso.split('-').map(Number);
  return `${d} ${HINDI_MONTHS[m-1]} ${y}`;
}
function shortHindiDate(iso){
  if(!iso) return '';
  const [y,m,d] = iso.split('-').map(Number);
  return `${d} ${HINDI_MONTHS[m-1].slice(0,3)}`;
}
function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderArchiveSection(s){
  const dateLinks = s.dates.map(d => `<a href="${esc(d.url)}">${shortHindiDate(d.date)}</a>`).join('\n          ');
  const first = s.dates[0], last = s.dates[s.dates.length-1];
  return `
  <div class="qsec" id="${esc(s.id)}">
    <div class="qsec-head"><h2>${s.icon} ${esc(s.name)}</h2><span class="qsec-count">${s.dates.length} Quiz</span></div>
    <p class="qsec-sub">${esc(s.description)}</p>
    <div class="archive-card">
      <div class="ac-icon">📰</div>
      <div class="ac-info">
        <div class="ac-title">${esc(s.archiveTitle)}</div>
        <div class="ac-desc">${esc(s.archiveDesc)}</div>
        <div class="ac-dates">
          ${dateLinks}
        </div>
      </div>
      <a href="${esc(s.archiveUrl)}" class="ac-btn">सभी देखें →</a>
    </div>
  </div>`;
}

function renderGridSection(s){
  const cards = s.quizzes.map(q => `
      <a class="quiz-card" href="${esc(q.url)}">
        <span class="quiz-icon">${q.icon}</span>
        <div class="quiz-info">
          <div class="quiz-title">${esc(q.title)}</div>
          <div class="quiz-meta"><span>${esc(q.questions)} प्रश्न</span><span>${esc(q.duration)}</span><span>${hindiDate(q.date)}</span></div>
        </div>
        <span class="quiz-arrow">→</span>
      </a>`).join('');
  const pageLink = s.subjectPageUrl ? `<a href="${esc(s.subjectPageUrl)}" class="sec-page-link">📖 पूरा Subject Page →</a>` : '';
  return `
  <div class="qsec" id="${esc(s.id)}">
    <div class="qsec-head"><h2>${s.icon} ${esc(s.name)}</h2><span class="qsec-count">${s.quizzes.length} Quiz</span></div>
    <p class="qsec-sub">${esc(s.description)} ${pageLink}</p>
    <div class="quiz-grid">${cards}
    </div>
  </div>`;
}

function renderSubjectPagesSection(pages){
  if (!pages || !pages.length) return '';
  const chips = pages.map(p => `<a href="${esc(p.url)}" class="subj-chip">${p.icon} ${esc(p.title)}</a>`).join('');
  return `
  <div class="qsec" id="subject-pages">
    <div class="qsec-head"><h2>📚 RAS Pre — Subject-wise Quiz Pages</h2><span class="qsec-count">${pages.length} Subjects</span></div>
    <p class="qsec-sub">हर Subject का अपना अलग Quiz Page — जैसे-जैसे नए Chapter Quiz Publish होंगे, यहीं जुड़ते जाएंगे</p>
    <div class="subj-chips">${chips}</div>
  </div>`;
}

fetch('/quizzes-data.json')
  .then(r => r.json())
  .then(data => {
    const subjects = data.subjects || [];
    let total = 0;
    subjects.forEach(s => { total += s.type === 'archive' ? s.dates.length : s.quizzes.length; });
    const dailyCount = (subjects.find(s => s.type === 'archive') || {}).dates?.length || 0;
    const subjectCount = subjects.filter(s => s.type === 'grid').length;

    document.getElementById('statsBar').innerHTML = `
      <div class="stat-chip"><div class="sn">${total}</div><div class="sl">कुल Quiz</div></div>
      <div class="stat-chip"><div class="sn">${dailyCount}</div><div class="sl">Daily CA Quiz</div></div>
      <div class="stat-chip"><div class="sn">${subjectCount}</div><div class="sl">Subject Categories</div></div>
    `;

    document.getElementById('quickNav').innerHTML = subjects.map(s =>
      `<a href="#${esc(s.id)}">${s.icon} ${esc(s.name.split('(')[0].trim())}</a>`
    ).join('');

    const html = subjects.map(s => s.type === 'archive' ? renderArchiveSection(s) : renderGridSection(s)).join('');
    const subjectPagesHtml = renderSubjectPagesSection(data.subjectPages);
    document.getElementById('quizWrap').innerHTML = html + subjectPagesHtml + '<div class="back-link"><a href="index.html">← Home पर वापस जाएं</a></div>';
  })
  .catch(err => {
    document.getElementById('quizWrap').innerHTML = '<div class="load-msg">Quiz list लोड नहीं हो पाई। कृपया page reload करें।</div>';
    console.error(err);
  });
</script>
