name: Static SEO Optimization
on:
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - 'seo/optimize_seo.py'
      - 'sitemap.xml'
      - 'search-index.json'
      - 'robots.txt'
      - 'llms.txt'
      - 'llms-full.txt'
      - '.github/workflows/seo.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 seo/selfhost_fonts.py || echo "font self-hosting skipped"
      - run: python3 seo/optimize_seo.py
      - name: Commit SEO changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' sitemap.xml search-index.json assets/fonts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "SEO: optimize all static pages"
          git push
