name: Add RAS Mains PYQ Links

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add links
        run: |
          python - <<'PY'
          from pathlib import Path

          card = '''\n<section id="ras-mains-pyqs-promo" style="margin:28px auto;padding:22px;max-width:1100px;background:linear-gradient(135deg,#1d2d6f,#273d91);color:#fff;border-radius:14px;box-shadow:0 8px 22px #1d2d6f22">\n  <div style="font-size:14px;font-weight:700;opacity:.9">RPSC RAS MAINS • PAPER-I</div>\n  <h2 style="margin:6px 0 8px;font-size:26px">📚 309 RAS Mains Paper-I PYQs</h2>\n  <p style="margin:0 0 14px;line-height:1.6">इतिहास, अर्थव्यवस्था, समाजशास्त्र, प्रबंधन, लेखांकन एवं अंकेक्षण के 309 प्रश्न — वर्ष और अंक सहित।</p>\n  <a href="ras-mains-paper-1-pyqs.html" style="display:inline-block;background:#ff6b00;color:#fff;text-decoration:none;font-weight:700;padding:10px 16px;border-radius:9px">PYQs पढ़ें →</a>\n</section>\n'''

          for name in ['index.html', 'previous-year-papers.html']:
              p = Path(name)
              if not p.exists():
                  continue
              s = p.read_text(encoding='utf-8')
              if 'id="ras-mains-pyqs-promo"' in s:
                  continue
              marker = '</main>'
              if marker in s:
                  s = s.replace(marker, card + marker, 1)
              else:
                  s = s.replace('</body>', card + '</body>', 1)
              p.write_text(s, encoding='utf-8')
          PY

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html previous-year-papers.html
          if git diff --cached --quiet; then
            echo "No link changes needed"
            exit 0
          fi
          git commit -m "Add RAS Mains Paper-I PYQs links"
          git push
