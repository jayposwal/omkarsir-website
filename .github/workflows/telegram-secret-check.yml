name: Verify Telegram bot secret

on:
  push:
    paths:
      - '.github/workflows/telegram-secret-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-secret:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Telegram token without posting
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          test -n "$TELEGRAM_BOT_TOKEN"
          response=$(curl --fail-with-body --silent --show-error \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getMe")
          RESPONSE="$response" python3 - <<'PY'
          import json, os
          result = json.loads(os.environ["RESPONSE"])
          if not result.get("ok"):
              raise SystemExit("Telegram rejected TELEGRAM_BOT_TOKEN")
          print("Telegram bot secret is valid")
          PY
