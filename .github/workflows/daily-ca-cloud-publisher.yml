name: Daily Current Affairs & Quiz Cloud Publisher

on:
  schedule:
    # 01:15 UTC = 06:45 AM IST (runs every day)
    - cron: '15 1 * * *'
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Target date (YYYY-MM-DD), default is today (IST)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  publish-and-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies for WeasyPrint (Pango/Cairo/HarfBuzz)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf-2.0-0 \
            libcairo2 libharfbuzz0b fonts-dejavu-core fonts-noto-core fonts-indic

      - name: Install Python dependencies
        run: |
          pip install requests beautifulsoup4 weasyprint fonttools

      - name: Run Daily CA Cloud Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TARGET_DATE: ${{ github.event.inputs.target_date }}
        run: |
          python3 automation/daily_ca_cloud_pipeline.py

      - name: Commit and push changes to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            TODAY_STR=$(python3 -c "import datetime; print((datetime.datetime.utcnow() + datetime.timedelta(hours=5, minutes=30)).strftime('%d %b %Y'))")
            git commit -m "Daily CA + Quiz: $TODAY_STR [skip ci]"
            git push origin main
          fi

      - name: Post Daily Current Affairs PDF to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: "@omkarsirofficial"
        run: |
          python3 automation/post_daily_ca_to_telegram.py

      - name: Post Daily Quiz & Polls to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: "@omkarsirofficial"
        run: |
          python3 automation/post_daily_quiz_to_telegram.py
