-ans-text{font-size:13.5px;color:#1a1a2e;line-height:1.85;}.ra-noans{margin-top:10px;font-size:12px;color:#94a3b8;font-style:italic;}.ra-notrans{margin-top:6px;font-size:10.5px;color:#94a3b8;font-style:italic;}.ra-footer{text-align:center;font-size:11px;color:#6b7280;padding:20px 16px 10px;}.ra-footer a{color:#FF6B00;text-decoration:none;font-weight:700;}.ra-wrap .ra-q[data-lang="en"],.ra-wrap .ra-ans[data-lang="en"]{display:none;}.ra-wrap.lang-en .ra-q[data-lang="hi"],.ra-wrap.lang-en .ra-ans[data-lang="hi"]{display:none;}.ra-wrap.lang-en .ra-q[data-lang="en"],.ra-wrap.lang-en .ra-ans[data-lang="en"]{display:block;}#printBtnFloat{position:fixed;bottom:20px;right:20px;z-index:999;padding:12px 20px;border-radius:30px;border:none;background:linear-gradient(135deg,#FF6B00,#cc5500);color:#fff;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.25);font-family:'Noto Sans Devanagari',sans-serif}@media print{#printBtnFloat,.ra-langbar{display:none!important}body{background:#fff!important}.ra-card{break-inside:avoid;box-shadow:none!important}.ra-wrap .ra-q[data-lang],.ra-wrap .ra-ans[data-lang]{display:block!important;}}@media(max-width:600px){.ra-chapter{font-size:16px}.ra-header{padding:18px 16px 12px}.ra-body{padding:10px}.ra-card{padding:12px}}body.ra-dark{background:#0b1220;color:#e5e9f5;}body.ra-dark .ra-header{background:linear-gradient(135deg,#0c1338,#141c4a);}body.ra-dark .ra-langbar{background:#11172c;border-bottom-color:#FF6B00;box-shadow:0 2px 8px rgba(0,0,0,.35);}body.ra-dark .ra-lang-btn{background:#1a2140;border-color:#2a3358;color:#c7d0f0;}body.ra-dark .ra-lang-btn.active{background:#FF6B00;border-color:#FF6B00;color:#fff;}body.ra-dark .ra-card{background:#141b33;border-color:#232c4d;box-shadow:none;}body.ra-dark .ra-qnum{color:#8fa3ff;}body.ra-dark .ra-marks{background:rgba(255,107,0,.18);color:#FFB27A;border-color:rgba(255,107,0,.4);}body.ra-dark .ra-q{color:#e5e9f5;}body.ra-dark .ra-ans{background:#0f2419;border-color:#1c3d2c;}body.ra-dark .ra-ans-lbl{color:#34d399;}body.ra-dark .ra-ans-text{color:#e5e9f5;}body.ra-dark .ra-noans,body.ra-dark .ra-notrans{color:#7c88ab;}body.ra-dark .ra-footer{color:#8891ab;}body.ra-dark .ra-footer a{color:#FF8A3D;}@media print{body.ra-dark{background:#fff!important;color:#000!important}}
.dt-topbar{background:#1B2A6B;padding:10px 16px;text-align:center;}
.dt-topbar a{color:#FFD700;text-decoration:none;font-size:12px;font-weight:700;}
.dt-loading,.dt-error{text-align:center;padding:60px 20px;color:#6b7280;font-size:13px;}
.dt-error a{color:#FF6B00;font-weight:700;}
.dt-dl-section{background:#fff;max-width:800px;margin:18px auto;border:1.5px solid #FF6B00;border-radius:10px;padding:16px;}
.dt-dl-title{font-size:13px;font-weight:800;color:#1B2A6B;margin-bottom:10px;text-align:center;}
.dt-dl-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
.dt-dl-btn{display:flex;align-items:center;gap:8px;background:#f6f8fd;border:1px solid #dbe3f5;border-radius:8px;padding:10px 12px;text-decoration:none;color:#1a1a2e;font-size:12.5px;font-weight:700;transition:.2s;}
.dt-dl-btn:hover{background:#eef2fc;border-color:#1B2A6B;}
.dt-dl-btn .ic{font-size:16px;}
@media(max-width:600px){.dt-dl-grid{grid-template-columns:1fr}}
body.ra-dark .dt-dl-section{background:#141b33;border-color:#FF6B00;}
body.ra-dark .dt-dl-title{color:#8fa3ff;}
body.ra-dark .dt-dl-btn{background:#1a2140;border-color:#2a3358;color:#e5e9f5;}
body.ra-dark .dt-dl-btn:hover{background:#232c4d;border-color:#FF6B00;}
</style>
</head>
<body>
<div class="dt-topbar"><a href="/ras-mains-answer-writing.html">← सारे RAS Mains Test देखें</a></div>
<div id="dtReadArea"><div class="dt-loading">⏳ Content लोड हो रहा है...</div></div>
<div id="dtDlSection"></div>
<script>
function raSetLang(lang, btnEl){var wrap = btnEl.closest('.ra-wrap'); if(!wrap) return;wrap.classList.toggle('lang-en', lang==='en');wrap.querySelectorAll('.ra-lang-btn').forEach(function(b){ b.classList.toggle('active', b.getAttribute('data-lang')===lang); });try{ localStorage.setItem('nied_ra_lang', lang); }catch(e){}}function raRestoreLang(root){try{  var lang = localStorage.getItem('nied_ra_lang');  if(lang==='en'){    (root||document).querySelectorAll('.ra-wrap').forEach(function(wrap){      wrap.classList.add('lang-en');      wrap.querySelectorAll('.ra-lang-btn').forEach(function(b){ b.classList.toggle('active', b.getAttribute('data-lang')==='en'); });    });  }}catch(e){}}function raToggleTheme(btnEl){var isDark = document.body.classList.toggle('ra-dark');document.querySelectorAll('.ra-theme-btn').forEach(function(b){ b.textContent = isDark ? '☀️ Light Mode' : '🌙 Dark Mode'; });try{ localStorage.setItem('nied_ra_theme', isDark ? 'dark' : 'light'); }catch(e){}}function raRestoreTheme(){try{  if(localStorage.getItem('nied_ra_theme')==='dark'){    document.body.classList.add('ra-dark');    document.querySelectorAll('.ra-theme-btn').forEach(function(b){ b.textContent = '☀️ Light Mode'; });  }}catch(e){}}
(function(){
  var params = new URLSearchParams(window.location.search);
  var id = params.get('id');
  var DL_LABELS = {
    workbookHi: {icon:'📄', label:'Workbook (Hindi) PDF'},
    workbookBi: {icon:'🌐📄', label:'Bilingual Workbook PDF'},
    modelHi:    {icon:'📚', label:'Model Answer (Hindi) PDF'},
    modelBi:    {icon:'🌐📚', label:'Bilingual Model Answer PDF'},
    key:        {icon:'🔑', label:'Answer Key Sheet PDF'},
    fullSetBi:  {icon:'📦🌐', label:'Bilingual Full Set PDF'}
  };
  if(!id){
    document.getElementById('dtReadArea').innerHTML = '<div class="dt-error">⚠️ कोई Test ID नहीं मिला। <a href="/ras-mains-answer-writing.html">वापस जाएं</a></div>';
    return;
  }
  fetch('/mains-tests-data.json').then(function(r){ return r.json(); }).then(function(data){
    var test = null;
    (data.papers||[]).forEach(function(p){
      (p.tests||[]).forEach(function(t){ if(t.id === id){ test = t; } });
    });
    if(!test){
      document.getElementById('dtReadArea').innerHTML = '<div class="dt-error">⚠️ यह Test नहीं मिला। हो सकता है link पुराना हो। <a href="/ras-mains-answer-writing.html">वापस जाएं</a></div>';
      return;
    }

    if(test.files && test.files.read){
      fetch(test.files.read).then(function(r){ return r.text(); }).then(function(html){
        var doc = new DOMParser().parseFromString(html, 'text/html');
        var wrapEl = doc.querySelector('.ra-wrap');
        var area = document.getElementById('dtReadArea');
        area.innerHTML = wrapEl ? wrapEl.outerHTML : doc.body.innerHTML;
        raRestoreLang(area);
        raRestoreTheme();
      }).catch(function(){
        document.getElementById('dtReadArea').innerHTML = '<div class="dt-error">⚠️ Readable content load नहीं हुआ — नीचे से PDF देखें।</div>';
      });
    } else {
      document.getElementById('dtReadArea').innerHTML = '<div class="dt-error">इस Test का readable version उपलब्ध नहीं है — नीचे से PDF download करें।</div>';
    }

    var files = test.files || {};
    var btns = '';
    Object.keys(DL_LABELS).forEach(function(k){
      if(files[k]) btns += '<a class="dt-dl-btn" href="'+files[k]+'" target="_blank"><span class="ic">'+DL_LABELS[k].icon+'</span>'+DL_LABELS[k].label+'</a>';
    });
    if(btns){
      document.getElementById('dtDlSection').innerHTML =
        '<div class="dt-dl-section"><div class="dt-dl-title">⬇️ PDF Download करें (page खुलने पर 🖨️ बटन से)</div><div class="dt-dl-grid">'+btns+'</div></div>';
    }
  }).catch(function(){
    document.getElementById('dtReadArea').innerHTML = '<div class="dt-error">⚠️ Data load नहीं हुआ। कृपया बाद में try करें।</div>';
  });
})();
</script>
</body>
</html>
